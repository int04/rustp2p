[package]
name = "rust-p2p-viewer"
version = "0.3.1"
edition = "2021"
description = "Direct LAN peer-to-peer screen viewer — low latency"
authors = ["teamv-io"]

[[bin]]
name = "rust-p2p-viewer"
path = "src/main.rs"

# Installer/bundle metadata for cargo-packager (produces .dmg / .msi / setup.exe)
[package.metadata.packager]
product-name = "Rust P2P Viewer"
identifier = "io.teamv.rustp2pviewer"
description = "Direct LAN peer-to-peer screen viewer — low latency"
long-description = "A LAN-only peer-to-peer screen viewing tool. Direct connection between machines on the same network for minimal latency. Host shares its screen; viewers are strictly view-only."
authors = ["teamv-io"]
icons = ["icons/icon.icns", "icons/icon.ico", "icons/icon.png"]
category = "Utility"

[features]
# `capture` pulls in scap (the screen-capture backend). It's on by default for
# real builds; disabling it (`--no-default-features`) yields a viewer-only build
# that also compiles on machines without full Xcode (scap → cidre needs it).
default = ["capture"]
capture = ["dep:scap"]

[patch.crates-io]
# Patch scap 0.1.0-beta.1: fix Windows backend (timespan→timestamp, WCSettings arg order)
scap = { path = "vendor/scap" }

[dependencies]
# Screen capture — wraps DXGI (Windows) and ScreenCaptureKit (macOS). Optional so a
# viewer-only build can compile without the capture backend (see [features]).
scap = { version = "0.1.0-beta.1", optional = true }

# CPU H.264 encode/decode — downloads Cisco's prebuilt OpenH264 at build time
openh264 = { version = "0.9", features = ["source"] }

# Cross-platform hardware H.264/H.265 decoder: VideoToolbox (macOS), Media Foundation + D3D11 (Windows).
openipc-video = "0.1.40"

# GUI framework (replaces winit + softbuffer)
eframe = "0.34"

# Fast inter-thread channels
crossbeam-channel = "0.5"
socket2 = "0.5"
# SIMD NV12->RGBA conversion (AVX/SSE on Windows) for low-latency GPU decode display.
yuvutils-rs = { version = "0.8.3", features = ["fast_mode"] }

# Encryption: password KDF + AEAD for control channel and video stream
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"

# CLI / serialization / errors
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native Apple hardware H.264 via VideoToolbox. Kept target-scoped so Windows/Linux builds stay clean.
videotoolbox = { version = "0.21", features = ["compression"] }
apple-cf = "0.11"
